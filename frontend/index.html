<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Timetable &amp; Goals</title>
  <style>
    :root { --bg:#f5f6f8; --card:#fff; --ink:#1d2433; --muted:#6b7280; --accent:#0f766e; --danger:#b91c1c; --line:#e5e7eb; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, Segoe UI, Arial, sans-serif; background:var(--bg); color:var(--ink); }
    header { background:var(--accent); color:#fff; padding:18px 24px; }
    header h1 { margin:0; font-size:1.4rem; }
    header p { margin:4px 0 0; opacity:.85; font-size:.9rem; }
    main { max-width:1100px; margin:24px auto; padding:0 16px; display:grid; gap:24px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; }
    h2 { margin:0 0 14px; font-size:1.1rem; }
    form { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:12px; }
    label { display:flex; flex-direction:column; font-size:.85rem; color:var(--muted); gap:4px; }
    input, select, textarea { font:inherit; padding:8px; border:1px solid var(--line); border-radius:6px; color:var(--ink); }
    .full { grid-column:1 / -1; }
    .actions { grid-column:1 / -1; display:flex; gap:10px; }
    button { font:inherit; padding:8px 16px; border:0; border-radius:6px; cursor:pointer; }
    .primary { background:var(--accent); color:#fff; }
    .secondary { background:var(--line); color:var(--ink); }
    .danger { background:var(--danger); color:#fff; }
    .small { padding:4px 10px; font-size:.85rem; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; font-size:.9rem; }
    th, td { text-align:left; padding:8px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-weight:600; }
    td:nth-child(6) { white-space:nowrap; }
    td.btns { white-space:nowrap; display:flex; gap:6px; }
    #status { min-height:1.2em; font-size:.9rem; }
    .ok { color:var(--accent); } .err { color:var(--danger); }
  </style>
</head>
<body>
  <header>
    <h1>Student Timetable &amp; Goals</h1>
    <p>ICT251 Activity 4 · Node.js + Express + PostgreSQL CRUD</p>
  </header>

  <main>
    <section class="card">
      <h2 id="form-title">Add a class</h2>
      <form id="entry-form">
        <input type="hidden" id="id">
        <label>Course code *<input id="course_code" maxlength="20" required placeholder="ICT251"></label>
        <label>Course name<input id="course_name" maxlength="150" placeholder="Web Technologies"></label>
        <label>Lecturer<input id="lecturer" maxlength="120"></label>
        <label>Day *
          <select id="day_of_week" required>
            <option value="">-- choose --</option>
            <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
            <option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
          </select>
        </label>
        <label>Start time *<input id="start_time" type="time" required></label>
        <label>End time *<input id="end_time" type="time" required></label>
        <label>Venue<input id="venue" maxlength="80"></label>
        <label class="full">Weekly goal<textarea id="weekly_goal" rows="2"></textarea></label>
        <div class="actions">
          <button type="submit" class="primary" id="submit-btn">Add</button>
          <button type="button" class="secondary" id="cancel-btn" hidden>Cancel edit</button>
        </div>
      </form>
      <p id="status"></p>
    </section>

    <section class="card">
      <h2>Timetable (<span id="count">0</span>)</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>ID</th><th>Code</th><th>Course</th><th>Lecturer</th><th>Day</th><th>Time</th><th>Venue</th><th>Goal</th><th></th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
